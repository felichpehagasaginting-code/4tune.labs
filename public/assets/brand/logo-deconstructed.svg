<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%" fill="none" id="svg-deconstructed-root">
  <!-- 4tune.labs Kinetic Deconstructed SVG for GSAP Assembly -->
  
  <!-- Amber Quadrant 1 (Top-Left Ribbon + Crossbar) -->
  <g id="logo-part-amber-topleft" stroke="#E5A024" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 230 135 H 175 C 152 135 135 152 135 175 V 230 C 135 242 145 250 160 250 H 220" />
    <path d="M 135 190 H 215" stroke-width="20" />
    <path d="M 175 175 L 250 250" stroke-width="24" />
  </g>

  <!-- Amber Quadrant 2 (Bottom-Right Ribbon + Crossbar) -->
  <g id="logo-part-amber-bottomright" stroke="#E5A024" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 270 365 H 325 C 348 365 365 348 365 325 V 270 C 365 258 355 250 340 250 H 280" />
    <path d="M 285 310 H 365" stroke-width="20" />
    <path d="M 250 250 L 325 325" stroke-width="24" />
  </g>

  <!-- Emerald Quadrant 1 (Top-Right Ribbon + Stem) -->
  <g id="logo-part-emerald-topright" stroke="#239D60" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 270 135 H 325 C 348 135 365 152 365 175 V 230 C 365 242 355 250 340 250" />
    <path d="M 325 135 V 225" stroke-width="20" />
    <path d="M 325 175 L 250 250" stroke-width="24" />
  </g>

  <!-- Emerald Quadrant 2 (Bottom-Left Ribbon + Stem) -->
  <g id="logo-part-emerald-bottomleft" stroke="#239D60" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 230 365 H 175 C 152 365 135 348 135 325 V 270 C 135 258 145 250 160 250" />
    <path d="M 175 275 V 365" stroke-width="20" />
    <path d="M 250 250 L 175 325" stroke-width="24" />
  </g>

  <!-- Central Charcoal Housing / Arrow Structure -->
  <g id="logo-part-housing">
    <path d="M 250 148 L 298 194 V 292 H 202 V 194 Z" 
          fill="#2D3139" 
          stroke="#2D3139" 
          stroke-width="10" 
          stroke-linejoin="round" />
    <path d="M 250 178 L 274 204 H 262 V 274 H 238 V 204 H 226 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Central Emerald Core Hexagon -->
  <g id="logo-part-hex">
    <polygon points="250,224 268,234 268,256 250,266 232,256 232,234" 
             fill="#239D60" />
  </g>

  <!-- Typography Wordmark -->
  <g id="logo-wordmark" transform="translate(250, 440)" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="52" letter-spacing="-0.03em">
    <text y="0">
      <tspan id="logo-wordmark-4" fill="#E5A024">4</tspan><tspan id="logo-wordmark-tune" fill="#239D60">tune</tspan><tspan id="logo-wordmark-labs" fill="#2D3139" font-weight="600">.labs</tspan>
    </text>
  </g>
</svg>
